<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>English Quest — Hành trình chinh phục tiếng Anh</title>
<meta name="description" content="Học tiếng Anh trình độ A1–B1 qua 100 level, mỗi level 50 câu hỏi." />
<meta name="theme-color" content="#22283a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ===== MAP SCREEN ===== -->
  <section id="screen-map" class="screen active">
    <div class="passport-header">
      <div>
        <div class="title display">English Quest</div>
        <div class="subtitle">Hộ chiếu học tập · A1 → B1</div>
      </div>
      <div class="badge mono" id="map-badge">1/100</div>
    </div>
    <div class="path-wrap" id="path-wrap"></div>
    <div class="map-footer">
      <button class="btn btn-ghost" id="export-btn">⬇ Xuất tiến độ</button>
      <label class="btn btn-ghost" style="cursor:pointer;">
        ⬆ Nhập tiến độ
        <input type="file" id="import-input" accept="application/json" style="display:none;" />
      </label>
    </div>
  </section>

  <!-- ===== INTRO SCREEN ===== -->
  <section id="screen-intro" class="screen">
    <div class="back-row">
      <button class="icon-btn" id="intro-back">←</button>
    </div>
    <div class="intro-card">
      <div class="lvl-num mono" id="intro-level-num">LEVEL 1 / 100</div>
      <h2 class="display" style="margin-top:6px;">Từ vựng trong level này</h2>
      <ul class="word-preview-list" id="word-preview-list"></ul>
      <div class="rule-box">
        📜 Trả lời <strong>50 câu hỏi</strong>. Cần đúng tối thiểu <strong>30/50</strong> để mở khoá level tiếp theo. Bấm “Gợi ý” nếu cần trợ giúp, và nghĩa sẽ hiện ra ngay sau khi bạn trả lời mỗi câu.
      </div>
      <p class="small-note" id="intro-best"></p>
    </div>
    <button class="btn btn-primary btn-block" id="intro-start">Bắt đầu ▶</button>
  </section>

  <!-- ===== QUIZ SCREEN ===== -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-top">
      <span class="mono" id="quiz-level-tag" style="font-size:0.8rem;color:var(--ink-soft);"></span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="score-chip" id="score-chip"></span>
    </div>

    <div class="question-card">
      <div class="question-type-tag" id="question-type-tag"></div>
      <div class="question-prompt" id="question-prompt"></div>
      <button class="speak-btn" id="speak-btn" style="display:none;">🔊</button>

      <div class="choices" id="choices"></div>

      <div class="hint-row">
        <button class="btn btn-ghost" id="hint-btn">💡 Gợi ý</button>
        <div class="hint-text" id="hint-text"></div>
      </div>

      <div class="explain-box" id="explain-box"></div>

      <div class="quiz-actions">
        <button class="btn btn-primary btn-block" id="next-btn" style="display:none;">Câu tiếp theo →</button>
      </div>
    </div>
  </section>

  <!-- ===== RESULT SCREEN ===== -->
  <section id="screen-result" class="screen">
    <div class="result-wrap">
      <div class="stamp" id="stamp">
        <div class="big">PASS</div>
        <div class="label">Đã chinh phục Level</div>
      </div>
      <div class="result-score mono" id="result-score"></div>
      <div class="result-stars" id="result-stars"></div>
      <div class="result-actions">
        <button class="btn btn-primary btn-block" id="result-next" style="display:none;">Level tiếp theo →</button>
        <button class="btn btn-secondary btn-block" id="result-retry">Học lại level này</button>
        <button class="btn btn-ghost" id="result-map">← Về bản đồ hành trình</button>
      </div>
    </div>
  </section>

</div>

<script src="vocab.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
